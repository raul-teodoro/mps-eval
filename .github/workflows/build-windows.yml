# Gera o instalador do Windows numa máquina Windows do GitHub.
# Rode em Actions > "Instalador Windows" > Run workflow, ou crie uma tag v* (ex.: v1.0.0).
# O arquivo MPS-Eval-Setup-<versão>.exe aparece em "Artifacts" no fim da execução.
name: Instalador Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt pytest

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build do executável e do instalador
        run: python build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: MPS-Eval-Setup
          path: dist/MPS-Eval-Setup-*.exe
          if-no-files-found: error
